<!doctype html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZitWeb</title>
  <meta name="theme-color" content="#050510" />
  <!-- absolute paths (Vite adds the /zit-web/ base), so the icons load from deep pages like /pins/123 too -->
  <link rel="manifest" href="/shortcutIcon/webManifest.json">
  <link rel="icon" href="/shortcutIcon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="/shortcutIcon/favicon-96x96.png" sizes="96x96">
  <!-- iPhone "Add to Home Screen": iOS needs a 180x180 PNG -->
  <link rel="apple-touch-icon" href="/shortcutIcon/apple-touch-icon.png" sizes="180x180">
  <meta name="apple-mobile-web-app-title" content="ZIT">
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '=') {
        var q = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (q.slice(0, 1) !== '/' ? '/' : '') + q + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
