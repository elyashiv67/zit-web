<head>

  <title>zit-afula</title>
  <link rel="manifest" href="/src/assets/shortcutIcon/webManifest.json">
  <link rel="icon" href="/src/assets/shortcutIcon/favicon.ico">
  <link rel="shortcut icon" href="/src/assets/shortcutIcon/favicon.ico">
  <link rel="apple-touch-icon" href="/src/assets/shortcutIcon/favicon.ico">
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '=') {
        var q = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (q.slice(0, 1) !== '/' ? '/' : '') + q + l.hash
        );
      }
    }(window.location))
  </script>
</head>
